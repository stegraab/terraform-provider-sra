# Terraform Provider release workflow.
# Modified by Stegra AB for deliberate, manually approved releases.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to release (for example v1.4.0)
        required: true
        type: string
      confirm:
        description: Type "release" to confirm publication
        required: true
        type: string

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - name: Validate release request
        env:
          CONFIRM: ${{ inputs.confirm }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "release" ]]; then
            echo "Release confirmation did not match 'release'." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable SemVer tag such as v1.4.0." >&2
            exit 1
          fi
          if [[ "$(git describe --tags --exact-match)" != "$RELEASE_TAG" ]]; then
            echo "Checked-out commit is not tagged with $RELEASE_TAG." >&2
            exit 1
          fi
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
