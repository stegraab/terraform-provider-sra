# Terraform Provider release workflow.
# Modified by Stegra AB for deliberate, manually approved releases.
name: Manual Release

on:
  workflow_dispatch:

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - name: Fetch Stegra release tags
        run: git fetch --force --tags origin
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Compute and create next Stegra tag
        id: next_tag
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "UPSTREAM_VERSION must contain X.Y.Z, got '$base_version'." >&2
            exit 1
          fi

          base_tag="v${base_version}"
          max_n=0
          while IFS= read -r tag; do
            suffix="${tag##*.}"
            if [[ "$suffix" =~ ^[1-9][0-9]*$ ]] && (( suffix > max_n )); then
              max_n="$suffix"
            fi
          done < <(git tag --list "${base_tag}-stegra.*")

          next_tag="${base_tag}-stegra.$((max_n + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$next_tag" --message "Stegra provider release $next_tag"
          git push origin "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
